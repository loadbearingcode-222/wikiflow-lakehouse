resources:
  jobs:
    hello:
      name: wikiflow_hello_${bundle.target}
      description: Proves the deploy path - wheel, serverless task, catalog - and lists the schemas it finds.
      max_concurrent_runs: 1
      tasks:
        - task_key: hello
          environment_key: default
          max_retries: 0
          python_wheel_task:
            package_name: wikiflow
            entry_point: hello
            parameters: ["--catalog", "${var.catalog}"]
      environments:
        - environment_key: default
          spec:
            environment_version: ${var.environment_version}
            dependencies:
              - ../dist/*.whl

# Every merge to main deploys dev, then proves it with a run.
#
# A push to main IS a merge here: nothing else reaches main (story PRs only; the pre-push hook
# refuses direct pushes). No pull_request trigger: an unmerged branch must never overwrite dev.
# No workflow_dispatch: a dispatch can run on any branch, which is the same hole another way.
name: deploy-dev

on:
  push:
    branches: [main]

permissions:
  contents: read

# Merges queue and never race; a deploy already running is never cancelled halfway.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5  # the bundle builds the wheel with `uv build`
      - uses: databricks/setup-cli@main
        with:
          version: 1.16.1
      - name: databricks bundle deploy -t dev
        run: databricks bundle deploy -t dev
      - name: Smoke - the deployed hello job runs against wikiflow_dev
        run: databricks bundle run hello -t dev
      # Re-ingests two fixed hours on every merge. The job's own verify_run task fails the run
      # unless both hours reconcile with projectviews AND reproduce every earlier merge's totals
      # for the same files - so each merge re-proves idempotency, not just that the code runs.
      - name: Smoke - ingest_hours re-ingests 2026-09-15T10..11 and verifies them
        run: >-
          databricks bundle run ingest_hours -t dev
          --params start=2026-09-15T10,end=2026-09-15T11,max_hours=2,replace_present=true
      - name: Unity Catalog tags and bronze column comments (a diff; zero statements when unchanged)
        run: databricks bundle run governance -t dev

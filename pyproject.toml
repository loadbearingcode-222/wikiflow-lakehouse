[project]
name = "wikiflow"
version = "0.1.0"
description = "The wikiflow hourly Wikimedia pageviews pipeline, rebuilt on Databricks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
# Integration tests run Spark on serverless from the laptop (ADR 0010: 19.1 measured working).
connect = [
    "databricks-connect>=19.1,<19.2",
]

[project.scripts]
# Entry points for python_wheel_task (resources/job_*.yml). Each maps to src/wikiflow/tasks/.
hello = "wikiflow.tasks.hello:main"
feasibility_spike = "wikiflow.tasks.feasibility_spike:main"
ingest_hour = "wikiflow.tasks.ingest_hour:main"
company_pages_refresh = "wikiflow.tasks.company_pages_refresh:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiflow"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", ".github/scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "PTH",       # pathlib only: the repo path contains a space
    "RUF",
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["wikiflow", "story_lint", "layout_lint"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", ".github/scripts", "tests"]
mypy_path = ".github/scripts"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Spark is provided by the serverless runtime, not installed locally.
module = ["pyspark.*", "databricks.connect.*", "databricks.sdk.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure Python, no network, no Spark",
    "integration: Databricks Connect against the sandbox catalog (uv run --group connect pytest tests/integration)",
]
